<h2>Enrollment Request Form</h2>

<div *ngIf="submitted" class="success-message">
  <p>✅ Enrollment request submitted successfully!</p>
</div>

<form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)" *ngIf="!submitted">
  <!-- Student Name -->
  <div class="form-group">
    <label for="studentName">Student Name:</label>
    <input 
      type="text" 
      id="studentName"
      name="studentName" 
      [(ngModel)]="model.studentName"
      #nameCtrl="ngModel"
      required 
      minlength="3"
      class="form-control">
    <div class="error-messages">
      <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']" class="error">
        Name is required
      </span>
      <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']" class="error">
        Name must be at least 3 characters
      </span>
    </div>
  </div>

  <!-- Student Email -->
  <div class="form-group">
    <label for="studentEmail">Student Email:</label>
    <input 
      type="email" 
      id="studentEmail"
      name="studentEmail" 
      [(ngModel)]="model.studentEmail"
      #emailCtrl="ngModel"
      required 
      email
      class="form-control">
    <div class="error-messages">
      <span *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']" class="error">
        Email is required
      </span>
      <span *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']" class="error">
        Please enter a valid email
      </span>
    </div>
  </div>

  <!-- Course ID -->
  <div class="form-group">
    <label for="courseId">Course ID:</label>
    <input 
      type="number" 
      id="courseId"
      name="courseId" 
      [(ngModel)]="model.courseId"
      #courseCtrl="ngModel"
      required
      class="form-control">
    <div class="error-messages">
      <span *ngIf="courseCtrl.touched && courseCtrl.errors?.['required']" class="error">
        Course ID is required
      </span>
    </div>
  </div>

  <!-- Preferred Semester -->
  <div class="form-group">
    <label for="preferredSemester">Preferred Semester:</label>
    <select 
      id="preferredSemester"
      name="preferredSemester" 
      [(ngModel)]="model.preferredSemester"
      #semesterCtrl="ngModel"
      required
      class="form-control">
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>
  </div>

  <!-- Terms Checkbox -->
  <div class="form-group checkbox">
    <label>
      <input 
        type="checkbox" 
        name="agreeToTerms" 
        [(ngModel)]="model.agreeToTerms"
        #termsCtrl="ngModel"
        required>
      I agree to terms and conditions
    </label>
    <div class="error-messages">
      <span *ngIf="termsCtrl.touched && termsCtrl.errors?.['required']" class="error">
        You must agree to the terms
      </span>
    </div>
  </div>

  <div class="button-group">
    <button type="submit" [disabled]="enrollForm.invalid" class="btn-primary">
      Submit
    </button>
    <button type="button" (click)="onReset(enrollForm)" class="btn-secondary">
      Reset
    </button>
  </div>
</form>
