# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=9090

# ============================================
# APPLICATION NAME
# ============================================
spring.application.name=api-gateway

# ============================================
# GATEWAY ROUTE CONFIGURATION
# ============================================

# Route 1: Forward to external service (JSONPlaceholder API)
spring.cloud.gateway.routes[0].id=external-service
spring.cloud.gateway.routes[0].uri=https://jsonplaceholder.typicode.com
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/external/**

# Route 2: Forward to local service (example on port 8080)
spring.cloud.gateway.routes[1].id=local-service
spring.cloud.gateway.routes[1].uri=http://localhost:8080
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/local/**

# Route 3: HTTP Bin service with path rewrite
spring.cloud.gateway.routes[2].id=httpbin-service
spring.cloud.gateway.routes[2].uri=http://httpbin.org
spring.cloud.gateway.routes[2].predicates[0]=Path=/httpbin/**
spring.cloud.gateway.routes[2].filters[0].name=RewritePath
spring.cloud.gateway.routes[2].filters[0].args.regexp=/httpbin/?(?<remaining>.*)
spring.cloud.gateway.routes[2].filters[0].args.replacement=/${remaining}

# Route 4: Greet service with header modification
spring.cloud.gateway.routes[3].id=greet-service
spring.cloud.gateway.routes[3].uri=http://httpbin.org
spring.cloud.gateway.routes[3].predicates[0]=Path=/greet/**
spring.cloud.gateway.routes[3].filters[0].name=RewritePath
spring.cloud.gateway.routes[3].filters[0].args.regexp=/greet/?(?<remaining>.*)
spring.cloud.gateway.routes[3].filters[0].args.replacement=/${remaining}
spring.cloud.gateway.routes[3].filters[1].name=AddRequestHeader
spring.cloud.gateway.routes[3].filters[1].args.name=X-Gateway-Custom-Header
spring.cloud.gateway.routes[3].filters[1].args.value=HelloFromGateway

# Route 5: Service with retry mechanism
spring.cloud.gateway.routes[4].id=retry-service
spring.cloud.gateway.routes[4].uri=http://httpbin.org
spring.cloud.gateway.routes[4].predicates[0]=Path=/retry/**
spring.cloud.gateway.routes[4].filters[0].name=RewritePath
spring.cloud.gateway.routes[4].filters[0].args.regexp=/retry/?(?<remaining>.*)
spring.cloud.gateway.routes[4].filters[0].args.replacement=/${remaining}
spring.cloud.gateway.routes[4].filters[1].name=Retry
spring.cloud.gateway.routes[4].filters[1].args.retries=3
spring.cloud.gateway.routes[4].filters[1].args.statuses=500,503
spring.cloud.gateway.routes[4].filters[1].args.methods=GET,POST
spring.cloud.gateway.routes[4].filters[1].args.series=SERVER_ERROR

# Route 6: Service with timeout
spring.cloud.gateway.routes[5].id=timeout-service
spring.cloud.gateway.routes[5].uri=http://httpbin.org
spring.cloud.gateway.routes[5].predicates[0]=Path=/timeout/**
spring.cloud.gateway.routes[5].filters[0].name=RewritePath
spring.cloud.gateway.routes[5].filters[0].args.regexp=/timeout/?(?<remaining>.*)
spring.cloud.gateway.routes[5].filters[0].args.replacement=/${remaining}

# ============================================
# TIMEOUT CONFIGURATION
# ============================================
spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=10000

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web.reactive=DEBUG
logging.level.com.cognizant.apigateway=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================
# ACTUATOR CONFIGURATION
# ============================================
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.enabled=true
management.info.env.enabled=true